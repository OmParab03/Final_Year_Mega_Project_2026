<div class="auth-container">

  <!-- Toggle Buttons -->
  <div class="toggle-buttons">
    <button [class.active]="isSignIn" (click)="showSignIn()">
      Sign In
    </button>
    <button [class.active]="!isSignIn" (click)="showSignUp()">
      Sign Up
    </button>
  </div>

  <!-- Success Message -->
  <div class="success-msg" *ngIf="successMessage">
    ✅ {{ successMessage }}
  </div>

  <!-- Error Message -->
  <div class="error-msg" *ngIf="errorMessage">
    ❌ {{ errorMessage }}
  </div>

  <!-- Sign In Form -->
  <div *ngIf="isSignIn" class="form-box">
    <h2>Sign In</h2>
    <form (ngSubmit)="onSignIn()">

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="signInData.email"
          name="email"
          placeholder="Enter your email"
          required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="signInData.password"
          name="password"
          placeholder="Enter your password"
          required />
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="isLoading" class="btn-spinner"></span>
        {{ isLoading ? 'Signing In...' : 'Sign In' }}
      </button>

      <p class="switch-text">
        Don't have an account?
        <span (click)="showSignUp()">Sign Up</span>
      </p>

    </form>
  </div>

  <!-- Sign Up Form -->
  <div *ngIf="!isSignIn" class="form-box">
    <h2>Sign Up</h2>
    <form (ngSubmit)="onSignUp()">

      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          [(ngModel)]="signUpData.name"
          name="name"
          placeholder="Enter your full name"
          required />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="signUpData.email"
          name="email"
          placeholder="Enter your email"
          required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="signUpData.password"
          name="password"
          placeholder="Enter your password"
          required />
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input
          type="password"
          [(ngModel)]="signUpData.confirmPassword"
          name="confirmPassword"
          placeholder="Confirm your password"
          required />
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="isLoading" class="btn-spinner"></span>
        {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
      </button>

      <p class="switch-text">
        Already have an account?
        <span (click)="showSignIn()">Sign In</span>
      </p>

    </form>
  </div>

</div>
