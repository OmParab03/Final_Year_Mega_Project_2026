<div class="dashboard-container">
  <div class="error-msg" *ngIf="errorMessage">❌ {{ errorMessage }}</div>
  <div class="loading" *ngIf="loading"><p>Loading... ⏳</p></div>
  <div class="dashboard-card" *ngIf="user">
    <div class="dashboard-header">
      <h1>Welcome {{ user.name }} 🎉</h1>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
    <div class="profile-section">
      <div class="avatar">{{ user.name?.charAt(0).toUpperCase() }}</div>
      <div class="user-info">
        <h2>{{ user.name }}</h2>
        <p>{{ user.email }}</p>
      </div>
    </div>
    <div class="info-cards">
      <div class="info-card"><h3>👤 Name</h3><p>{{ user.name }}</p></div>
      <div class="info-card"><h3>📧 Email</h3><p>{{ user.email }}</p></div>
      <div class="info-card"><h3>🆔 ID</h3><p>{{ user.id }}</p></div>
      <div class="info-card clickable" (click)="goToSkin()"><h3>🔬 Skin Analysis</h3><p>Analyze your skin using AI</p></div>
    </div>
  </div>
</div>
