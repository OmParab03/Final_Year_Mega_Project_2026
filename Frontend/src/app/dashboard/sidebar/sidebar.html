<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-top">
    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="brand-name">ToxiScan</span>
    </div>

    <!-- Navigation -->
    <nav class="nav-menu">
      <!-- Dashboard -->
      <a class="nav-item"
         routerLink="/dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>Dashboard</span>
      </a>

      <!-- Analyze Skin (upload + results + history, all on one page) -->
      <a class="nav-item"
         routerLink="/dashboard/skin-analysis"
         routerLinkActive="active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        <span>Analyze Skin</span>
      </a>

      <!-- Profile -->
      <a class="nav-item"
         routerLink="/dashboard/profile"
         routerLinkActive="active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Profile</span>
      </a>

      <!-- Settings -->
      <!-- <a class="nav-item"
         routerLink="/dashboard/settings"
         routerLinkActive="active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42
                   M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <span>Settings</span>
      </a> -->
    </nav>
  </div>

  <!-- User Card -->
  <div class="sidebar-bottom">
    <div class="user-card" routerLink="/dashboard/profile">
      <div class="user-avatar-small">
        {{ user?.name?.charAt(0)?.toUpperCase() || 'U' }}
      </div>
      <div class="user-meta">
        <p class="user-card-name">{{ user?.name || 'Loading...' }}</p>
        <p class="user-card-email">{{ user?.email || '' }}</p>
      </div>
      <button class="logout-icon"
              (click)="logout(); $event.stopPropagation()"
              title="Logout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>
</aside>
