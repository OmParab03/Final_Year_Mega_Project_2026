<div class="analysis-container">
  <div class="analysis-card">

    <h2>Skin Analysis</h2>

    <!-- File Upload -->
    <input type="file" (change)="onFileSelected($event)">

    <!-- Image Preview -->
    <div *ngIf="selectedImage">
      <img [src]="selectedImage" alt="Preview">
    </div>

    <!-- Analyze Button -->
    <button (click)="analyzeSkin()">Analyze Skin</button>

    <!-- Results -->
    <div *ngIf="result.skinType">
      <h3>Results</h3>

      <p><strong>Skin Type:</strong> {{ result.skinType }}</p>
      <p><strong>Acne:</strong> {{ result.acne }}</p>
      <p><strong>Redness:</strong> {{ result.redness }}</p>
    </div>

  </div>
</div>
