<div class="history-wrapper">

  <!-- Header -->
  <div class="tab-header">
    <h2>Analysis History</h2>
    <p>Review your past skin analyses</p>
  </div>

  <!-- Loading State -->
  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading history...</p>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!loading && historyList.length === 0">
    <div class="empty-icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none"
           stroke="#cbd5e1" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
    </div>
    <h3>No history yet</h3>
    <p>Start your first skin analysis to see results here</p>
    <button class="btn-primary" (click)="goToAnalysis()">
      Start Analysis
    </button>
  </div>

  <!-- History Grid -->
  <div class="history-grid" *ngIf="!loading && historyList.length > 0">
    <div class="history-card" *ngFor="let item of historyList">

      <!-- Thumbnail -->
      <div class="history-thumb">
        <img [src]="item.thumbnail" alt="Scan thumbnail">
      </div>

      <!-- Info -->
      <div class="history-info">
        <p class="history-date">{{ item.date }}</p>
        <p class="history-result">{{ item.result }}</p>
      </div>

      <!-- Badge -->
      <span class="badge" [ngClass]="item.severity">
        {{ item.severity }}
      </span>

    </div>
  </div>

</div>
