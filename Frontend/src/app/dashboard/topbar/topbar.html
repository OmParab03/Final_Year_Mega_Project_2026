<header class="topbar">
  <!-- Menu Toggle Button -->
  <button class="menu-toggle" (click)="toggleSidebar()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <!-- Greeting -->
  <div class="topbar-right">
    <div class="greeting">
      <h2>
        Good {{ greeting }},
        <span class="highlight-name">
          {{ user?.name?.split(' ')[0] || 'there' }}
        </span>
      </h2>
      <p class="subtitle">Here's what's happening with your skin health</p>
    </div>
  </div>

  <!-- Profile Menu -->
  <div class="profile-menu-wrapper">
    <!-- Avatar Button -->
    <button class="topbar-avatar" (click)="toggleDropdown()">
      {{ user?.name?.charAt(0)?.toUpperCase() || 'U' }}
    </button>

    <!-- Dropdown Menu -->
    <div class="dropdown-menu" *ngIf="showDropdown">
      <!-- User Info -->
      <div class="dropdown-header">
        <div class="dropdown-avatar">
          {{ user?.name?.charAt(0)?.toUpperCase() || 'U' }}
        </div>
        <div class="dropdown-user-info">
          <p class="dropdown-name">{{ user?.name || 'User' }}</p>
          <p class="dropdown-email">{{ user?.email || '' }}</p>
        </div>
      </div>

      <div class="dropdown-divider"></div>

      <!-- Menu Items -->
      <a class="dropdown-item" routerLink="/dashboard/profile" (click)="closeDropdown()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>My Profile</span>
      </a>

      <a class="dropdown-item" routerLink="/dashboard/settings" (click)="closeDropdown()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>Change Password</span>
      </a>

      <div class="dropdown-divider"></div>

      <button class="dropdown-item logout" (click)="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </div>
</header>
